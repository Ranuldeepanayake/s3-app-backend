#List image tags in a docker image repository based on the tag type (develop, release, feature, bugfix).

name: List image tags

on:
  workflow_dispatch:
    inputs:
      #Input to select the action.
      INPUT_TAG_TYPE:
        description: 'Select tag type'
        required: true
        default: develop
        type: choice
        options:
          - DEVELOP
          - FEATURE
          - BUGFIX
          - RELEASE
          - HOTFIX
          - PRODUCTION

#Global environment variables.
env:
  INPUT_TAG_TYPE: ${{ github.event.inputs.INPUT_TAG_TYPE }}
  AWS_REGION: ap-southeast-1
  AWS_ROLE_ARN: arn:aws:iam::104322896078:role/CustomRoleGitHubWorkflows
  AWS_ALLOWED_ACCOUNT_IDS: 104322896078
  AWS_USERNAME: AWS
  ECR_REPOSITORY_URL: 104322896078.dkr.ecr.ap-southeast-1.amazonaws.com
  ECR_REPOSITORY_GROUP: s3-app
  ECR_REPOSITORY_NAME: backend

#Permissions.
permissions:
  contents: read
  id-token: write

jobs:
  list-image-tags:

    runs-on: ubuntu-latest  #Runner label.
    timeout-minutes: 30     #Timeout against runaway jobs.

    steps:
      # #Log in to the artifact repository.
      # - name: Configure AWS credentials
      #   uses: aws-actions/configure-aws-credentials@v5
      #   with:
      #     aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
      #     aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      #     aws-region: ${{ env.AWS_REGION }}

        #Print only the OIDC claims needed to diagnose the AWS trust-policy match.
      - name: Diagnose GitHub OIDC claims
        run: |
          python3 - <<'PY'
          import base64
          import json
          import os
          from urllib.parse import parse_qsl, urlencode, urlsplit, urlunsplit
          from urllib.request import Request, urlopen

          parts = urlsplit(os.environ["ACTIONS_ID_TOKEN_REQUEST_URL"])
          query = dict(parse_qsl(parts.query))
          query["audience"] = "sts.amazonaws.com"
          url = urlunsplit((parts.scheme, parts.netloc, parts.path, urlencode(query), parts.fragment))
          request = Request(
              url,
              headers={"Authorization": f"Bearer {os.environ['ACTIONS_ID_TOKEN_REQUEST_TOKEN']}"},
          )

          with urlopen(request) as response:
              token = json.load(response)["value"]

          encoded_payload = token.split(".")[1]
          payload = base64.urlsafe_b64decode(encoded_payload + "=" * (-len(encoded_payload) % 4))
          claims = json.loads(payload)
          print(f"OIDC sub: {claims.get('sub')!r}")
          print(f"OIDC aud: {claims.get('aud')!r}")
          PY

        # Authenticate to AWS using OIDC.
      - name: Configure AWS authentication
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: ${{ env.AWS_ALLOWED_ACCOUNT_IDS }}

      #Verify that the AWS CLI is configured correctly.
      - name: Verify AWS CLI
        run: |
          aws --version
          aws sts get-caller-identity

      #List non-production image tags with the AWS CLI.
      - name: List image tags
        if : ${{ env.INPUT_TAG_TYPE != 'PRODUCTION' }}
        run: |
          #Query the tags.
          aws ecr describe-images --repository-name "${ECR_REPOSITORY_GROUP}/${ECR_REPOSITORY_NAME}" \
          --query "imageDetails[?imageTags!=null].imageTags[]" --output text | tr '\t' '\n' | grep "$INPUT_TAG_TYPE" | \

          #Extract version and timestamp
          awk '{
            match($0, /[0-9]{8}_[0-9]{6}/, m);
            version=$1;
            timestamp=m[0];
            printf "%s %s %s\n", version, timestamp, $0
          }' | \

          #Sort: version descending, then timestamp descending
          sort -k1,1Vr -k2,2r | \

          #Extract full tag
          awk '{print $3}'

        #List production image tags with the AWS CLI.
      - name: List image tags
        if : ${{ env.INPUT_TAG_TYPE == 'PRODUCTION' }}
        run: |
          aws ecr describe-images --repository-name "${ECR_REPOSITORY_GROUP}/${ECR_REPOSITORY_NAME}" \
          --query "imageDetails[?imageTags!=null].imageTags[]" --output text | tr '\t' '\n' | sort -u | \
          grep -E "^[0-9]+\.[0-9]+\.[0-9]+$"


